<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Inventario Higher</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inventario">
<meta name="theme-color" content="#0E0E0F">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  :root{
    --bg:#0E0E0F; --card:#18181A; --card2:#222225; --line:#2C2C30;
    --txt:#F4F4F5; --sub:#9A9AA2; --acc:#F5B300; --ok:#22C55E; --bad:#EF4444;
    --foto:#EDEDEF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5;background:rgba(14,14,15,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .hin{max-width:960px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 10px}
  .top{display:flex;align-items:center;gap:10px}
  .logo{height:30px;width:auto;display:block;margin-bottom:4px}
  h1{font-size:20px;margin:2px 0 0;font-weight:700}
  .sync{margin-left:auto;font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  .dot.busy{background:var(--acc)} .dot.err{background:var(--bad)}
  .der{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .der .sync{margin-left:0}
  .rol{background:var(--card2);border:1px solid var(--line);color:var(--sub);border-radius:999px;padding:6px 11px;font-size:12px;cursor:pointer}
  .rol.on{background:var(--acc);border-color:var(--acc);color:#111;font-weight:700}
  .back{background:none;border:0;color:var(--acc);font-size:15px;padding:0;margin-bottom:6px;cursor:pointer}
  input{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:11px 12px;font-size:16px;outline:none}
  input:focus{border-color:var(--acc)}
  main{padding:12px 16px 100px;max-width:960px;margin:0 auto}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
  .stat b{display:block;font-size:20px} .stat span{font-size:12px;color:var(--sub)}

  /* catálogo de modelos */
  .cat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
  @media(min-width:640px){.cat{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:900px){.cat{grid-template-columns:repeat(4,1fr)}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .12s}
  .card:active{transform:scale(.98)}
  .ph{aspect-ratio:1/1;background:var(--foto);display:flex;align-items:center;justify-content:center;position:relative}
  .ph img{width:86%;height:86%;object-fit:contain;mix-blend-mode:multiply}
  .ph .nf{color:#888;font-size:12px}
  .badge{position:absolute;top:8px;right:8px;background:rgba(14,14,15,.85);color:#fff;font-weight:700;font-size:13px;border-radius:999px;padding:3px 9px}
  .badge.low{background:var(--bad)}
  .info{padding:10px 12px 12px}
  .info .n{font-weight:600;font-size:14px;line-height:1.25}
  .dots{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
  .cd{width:13px;height:13px;border-radius:50%;border:1px solid rgba(255,255,255,.25)}
  .info .s{font-size:11.5px;color:var(--sub);margin-top:6px}

  /* detalle */
  .hero{background:var(--foto);border-radius:18px;aspect-ratio:16/11;max-height:280px;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .hero img{height:88%;width:88%;object-fit:contain;mix-blend-mode:multiply}
  .colores{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
  .colores::-webkit-scrollbar{display:none}
  .col{flex:none;width:76px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:5px;cursor:pointer;text-align:center;color:var(--txt)}
  .col.on{border-color:var(--acc)}
  .col .mini{background:var(--foto);border-radius:9px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
  .col .mini img{width:88%;height:88%;object-fit:contain;mix-blend-mode:multiply}
  .col .cn{font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .col .cq{font-size:11px;color:var(--sub)}
  .resumen{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;color:var(--sub);font-size:13px}
  .resumen b{color:var(--txt);font-size:16px}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  @media(min-width:520px){.grid{grid-template-columns:repeat(4,1fr)}}
  @media(min-width:800px){.grid{grid-template-columns:repeat(6,1fr)}}
  .cell{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:center}
  .cell.low{border-color:rgba(239,68,68,.55);background:rgba(239,68,68,.07)}
  .cell .t{font-size:12px;color:var(--sub)}
  .cell .q{font-size:26px;font-weight:700;margin:2px 0 6px;cursor:pointer}
  .btns{display:flex;gap:6px}
  .btns button{flex:1;height:38px;border-radius:10px;border:0;font-size:20px;font-weight:700;cursor:pointer;background:var(--card2);color:var(--txt)}
  .btns button.plus{background:var(--acc);color:#111}
  .btns button:active{transform:scale(.95)}
  .tip{color:var(--sub);font-size:12.5px;margin-top:14px}

  /* listas */
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:8px}
  .th{width:52px;height:52px;flex:none;border-radius:10px;background:var(--foto);display:flex;align-items:center;justify-content:center}
  .th img{width:88%;height:88%;object-fit:contain;mix-blend-mode:multiply}
  .item .n{font-weight:600} .item .s{font-size:12.5px;color:var(--sub);margin-top:2px}
  .pill{margin-left:auto;text-align:right;min-width:48px}
  .pill b{font-size:18px;display:block} .pill small{color:var(--sub);font-size:11px}
  .warn{color:var(--bad)}
  .mov .c{font-weight:700;min-width:40px;text-align:center}
  .mov .c.p{color:var(--ok)} .mov .c.m{color:var(--bad)}
  .form{display:grid;gap:10px;margin-top:10px}
  .btn{background:var(--acc);color:#111;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:700;cursor:pointer}

  nav{position:fixed;bottom:0;left:0;right:0;background:rgba(18,18,20,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  nav button{flex:1;background:none;border:0;color:var(--sub);font-size:11px;padding:6px 0;cursor:pointer}
  nav button i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}
  nav button.on{color:var(--acc)}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90%}
  .toast.show{opacity:1}
  .empty{color:var(--sub);text-align:center;padding:40px 0}
  /* login */
  .login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  .login img{height:70px;margin-bottom:18px}
  .login h2{margin:0 0 6px;font-size:20px}
  .login p{color:var(--sub);margin:0 0 18px;font-size:14px}
  .login input{max-width:260px;text-align:center;font-size:24px;letter-spacing:.3em}
  .login .btn{width:100%;max-width:260px;margin-top:12px}
  .roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:400px}
  .rolbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 10px;color:var(--txt);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .12s,border-color .12s}
  .rolbox:active{transform:scale(.97)} .rolbox:hover{border-color:var(--acc)}
  .rolbox .ri{font-size:30px;margin-bottom:4px}
  .rolbox b{font-size:15px} .rolbox small{color:var(--sub);font-size:11.5px}
  .cajas{display:flex;gap:12px;justify-content:center;cursor:text}
  .caja{width:54px;height:62px;border-radius:14px;background:var(--card2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--txt)}
  .caja.activa{border-color:var(--acc)} .caja.llena{border-color:#555}
  .cajas.error{animation:sacudir .35s}
  @keyframes sacudir{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
  .oculto{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
  .volver{background:none;border:0;color:var(--sub);margin-top:16px;font-size:14px;cursor:pointer}
  /* secciones (solo administrador) */
  .secs{display:flex;gap:6px;margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
  .secs button{flex:1;border:0;background:none;color:var(--sub);padding:9px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer}
  .secs button.on{background:var(--acc);color:#111}
  /* materia prima */
  .cat-t{font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px}
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(min-width:640px){.tiles{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:900px){.tiles{grid-template-columns:repeat(4,1fr)}}
  .tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:transform .15s,border-color .15s;box-shadow:0 6px 18px rgba(0,0,0,.25)}
  .tile:hover,.tile:focus-visible{transform:translateY(-2px);border-color:var(--acc)}
  .tile.low{border-color:#5a1d1d}
  .tf{position:relative;aspect-ratio:1/1;background:#f3f3f1;display:flex;align-items:center;justify-content:center}
  .tf img{width:100%;height:100%;object-fit:cover}
  .tf .gbajo{position:absolute;top:8px;left:8px;z-index:2}
  .tf.ico,.chf.ico{background:linear-gradient(140deg,rgba(255,255,255,.22),rgba(0,0,0,.38)),var(--c);color:#fff;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .tf.ico{aspect-ratio:4/3}
  .tf.ico::before,.chf.ico::before{content:"";position:absolute;inset:0;background:url(logo.png) center/130% no-repeat;opacity:.07;transform:rotate(-12deg) scale(1.3)}
  .tf.ico img.hgr,.chf.ico img.hgr{height:auto;object-fit:contain;position:relative}
  .ico .hgr{width:62%;max-width:190px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));z-index:1}
  .ico .ini{position:absolute;right:10px;bottom:10px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(4px);font-size:13px;font-weight:800;letter-spacing:.06em;padding:3px 8px;border-radius:8px;z-index:1}
  .chf.ico{width:84px;height:84px;aspect-ratio:auto}.chf.ico .hgr{width:78%}.chf.ico .ini{display:none}
  .tile:hover .tf.ico{filter:brightness(1.08)}
  .tt{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;border-top:3px solid var(--acc)}
  .tt b{font-size:15px;line-height:1.2}.tt small{color:var(--sub);font-size:12px}
  .gbajo{display:inline-block;background:#5a1d1d;color:#ff8a80;font-size:11px;font-weight:600;padding:4px 8px;border-radius:999px;white-space:nowrap}
  .volver{all:unset;cursor:pointer;color:var(--acc);font-weight:600;padding:6px 0;margin-bottom:6px}
  .cathead{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px}
  .cathead h2{margin:0 0 4px;font-size:20px}.cathead p{margin:0 0 6px;color:var(--sub);font-size:13px}
  .chf{width:110px;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:#f3f3f1;flex:none}
  .chf.alta{width:96px;aspect-ratio:3/4}
  .chf img{width:100%;height:100%;object-fit:cover}
  @media(min-width:900px){.mpgrid.compacta{grid-template-columns:repeat(5,1fr)}}
  .mp.sf{position:relative}.mp.sf .cuerpo{padding-top:12px}
  .alerta2{position:absolute;top:8px;right:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;padding:3px 7px;border-radius:999px}
  .mpgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(min-width:640px){.mpgrid{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:900px){.mpgrid{grid-template-columns:repeat(4,1fr)}}
  .mp{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
  .mp.low{border-color:rgba(239,68,68,.6)}
  .mp .ft{position:relative;aspect-ratio:4/3;background:#2a2a2d;display:flex;align-items:center;justify-content:center}
  .mp .ft img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .mp .ft.ancho img{object-fit:contain;padding:6px}
  .mp .ft.alta{aspect-ratio:3/4}
  .mp .ft .nf{color:#777;font-size:12px}
  .mp .alerta{position:absolute;top:8px;left:8px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px}
  .mp .cuerpo{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
  .mp .n{font-weight:700;font-size:15px;line-height:1.2}
  .mp .s{font-size:11.5px;color:var(--sub)}
  .mp .cant{cursor:pointer;display:flex;align-items:baseline;gap:4px}
  .mp .cant b{font-size:26px} .mp .cant small{color:var(--sub);font-size:12px}
  .mp .acc{display:flex;gap:6px;margin-top:auto}
  .mp .acc button{flex:1;height:38px;border-radius:10px;border:0;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;padding:0 4px}
  .bin{background:var(--ok);color:#06210f} .bout{background:var(--card2);color:var(--txt)}
  .tipo{font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px}
  .tipo.Entrada{background:rgba(34,197,94,.15);color:var(--ok)} .tipo.Salida{background:rgba(239,68,68,.15);color:var(--bad)} .tipo.Conteo{background:rgba(245,179,0,.15);color:var(--acc)}
</style>
</head>
<body>
<header id="cab"><div class="hin" id="hdr"></div></header>
<main id="app"><div class="empty">Cargando…</div></main>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>

<script>
/* ---------- conexión con la hoja de Google (Apps Script) ---------- */
const API = 'https://script.google.com/macros/s/AKfycbzmtdVVl3ptvrOrlAo2PoKHOk1atA1fhul5sgtPWr2By91VU4bqt2r1ZEyuXi4OV3MQNw/exec';
// Roles: admin (todo), bodega (botas terminadas), mp (materia prima). Cada uno entra con su PIN.
let PIN = '', ROL = '';
try { PIN = localStorage.getItem('pinHGR') || ''; ROL = localStorage.getItem('rolHGR') || ''; } catch(e) {}
function guardarSesion(p, r){ PIN = p || ''; ROL = r || ''; try { if(p){ localStorage.setItem('pinHGR', p); localStorage.setItem('rolHGR', r); } else { localStorage.removeItem('pinHGR'); localStorage.removeItem('rolHGR'); } } catch(e) {} }
const NOMBRE_ROL = { admin:'Administrador', bodega:'Bodega', mp:'Materia prima', ventas:'Ventas', jefes:'Jefes' };
// Ventas y Jefes solo consultan; Jefes y el administrador ven las dos secciones
const soloVer = () => ROL==='ventas' || ROL==='jefes';
const veAmbas = () => ROL==='admin' || ROL==='jefes';

async function llamar(accion, ...args){
  const r = await fetch(API, { method:'POST', body: JSON.stringify({accion, args, pin: PIN}), headers:{'Content-Type':'text/plain;charset=utf-8'} });
  if(!r.ok) throw new Error('Sin conexión ('+r.status+')');
  const j = await r.json();
  if(!j.ok){
    if(/PIN incorrecto/.test(j.error)){ guardarSesion('', ''); setTimeout(iniciar, 0); }
    throw new Error(j.error);
  }
  return j.data;
}

/* ---------- fotos (carpeta fotos/) ---------- */
const slug = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const FOTO_MODELO = {
  'bota-fusion':'png','bota-race-white':'png','bota-militar':'png','botin-force':'png','botin-urban-soft':'png',
  'botin-force-industrial':'png','botin-sport':'png','bota-race':'png','botin-street':'png','bota-ingeniero-nobuck':'webp',
  'bota-ingeniero-lona':'png','bota-ingeniero':'webp','bota-basica-industrial':'webp','bota-militar-motorizada':'webp',
  'bota-motorizada-media-cana':'webp','bota-cana-alta-suela-militar':'jpg','botin-urban-force':'jpg','bota-touring-white':'jpg','bota-touring-force':'jpg','bota-fusion-force':'jpg','bota-motorizada-cana-alta-elite':'jpg','botin-urban':'webp','botin-urban-flex':'webp',
  'botin-urban-go':'webp','bota-touring-race':'png'
};
const FOTO_COLOR = {};
[
 'bota-race-white--azul-celeste.png','bota-race-white--gris.webp','bota-race-white--morado.png','bota-race-white--naranja.png','bota-race-white--neon.webp',
 'botin-urban-soft--rojo.png','botin-urban-soft--azul.png','botin-urban-soft--gris.png','botin-urban-soft--fucsia.png','botin-urban-soft--neon.png',
 'botin-sport--azul-oscuro.jpg','botin-sport--fucsia.png','botin-sport--gris.png','botin-sport--neon.png','botin-sport--rojo.png',
 'bota-race--rojo.png','bota-race--azul-oscuro.png','bota-race--fucsia.png','bota-race--gris.png','bota-race--neon.png',
 'botin-street--rojo.png','botin-street--azul-oscuro.png','botin-street--fucsia.png','botin-street--gris.png','botin-street--neon.png',
 'bota-ingeniero-lona--cafe.png','bota-ingeniero-lona--negro.png','bota-ingeniero--cafe.png','bota-ingeniero--negro.webp',
 'bota-basica-industrial--cafe.jpeg','bota-basica-industrial--negro.webp',
 'botin-urban--rojo.png','botin-urban--azul.png','botin-urban--fucsia.png','botin-urban--gris.png','botin-urban--neon.png',
 'bota-touring-race--rojo.png','bota-touring-race--azul.png','bota-touring-race--fucsia.png','bota-touring-race--gris.png','bota-touring-race--neon.png',
 'botin-sport--gris-claro.jpg','botin-sport--cafe.jpg','botin-urban-go--rojo.jpg','botin-urban-go--morado.jpg','botin-urban-force--rojo.jpg','bota-fusion-force--negro.jpg','bota-touring-white--azul.jpg','bota-touring-force--fucsia.jpg','bota-race-white--fucsia.webp'
].forEach(f=>{ FOTO_COLOR[f.replace(/\.[a-z]+$/,'')] = 'fotos/'+f; });
function foto(modelo, color){
  const m = slug(modelo);
  if(color && FOTO_COLOR[m+'--'+slug(color)]) return FOTO_COLOR[m+'--'+slug(color)];
  return FOTO_MODELO[m] ? 'fotos/'+m+'.'+FOTO_MODELO[m] : '';
}
const img = (src, alt='') => src ? `<img loading="lazy" src="${src}" alt="${esc(alt)}">` : '<span class="nf">Sin foto</span>';
const TONO = {negro:'#111',cafe:'#6B4423',gris:'#8E8E93',azul:'#1E5BD8','azul-oscuro':'#1B2A6B','azul-celeste':'#6EC6F0',
  fucsia:'#E0218A',neon:'#C6F21C',rojo:'#D7261E',morado:'#7B3FB8',naranja:'#F07A1A',blanco:'#fff',verde:'#2E8B57'};
const tono = c => TONO[slug(c)] || '#555';

let S = { sec:'bodega', filas:[], mp:[], vista:'modelos', modelo:null, color:null, q:'', pend:0 };
const $ = s => document.querySelector(s);
const fmt = n => Number(n).toLocaleString('es-CO', {maximumFractionDigits:3});
const plata = n => '$' + Math.round(n).toLocaleString('es-CO');
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2200); }
function estado(){ const d=$('.dot'), l=$('#syncTxt'); if(!d) return;
  d.className='dot'+(S.err?' err':S.pend?' busy':''); l.textContent=S.err?'Sin conexión':S.pend?'Guardando…':'Sincronizado'; }

/* ---------- inicio de sesión ---------- */
const ROLES_LOGIN = [
  ['bodega','👢','Bodega','Botas terminadas'],
  ['mp','📦','Materia prima','Materiales de producción'],
  ['ventas','🏷️','Ventas','Consultar existencias'],
  ['jefes','👔','Jefes','Ver bodega y materia prima']
];
function vLogin(){
  $('#cab').style.display='none'; $('#nav').style.display='none';
  $('#app').innerHTML = `<div class="login">
    <img src="logo.png" alt="HGR Higher">
    <h2>Inventario Higher</h2>
    <p>¿Quién eres?</p>
    <div class="roles">${ROLES_LOGIN.map(([r,i,t,d])=>`<button class="rolbox" data-r="${r}"><span class="ri">${i}</span><b>${t}</b><small>${d}</small></button>`).join('')}</div></div>`;
  document.querySelectorAll('.rolbox').forEach(b=>b.onclick=()=>vPin(b.dataset.r));

function vPin(rol){
  const info = ROLES_LOGIN.find(x=>x[0]===rol);
  $('#app').innerHTML = `<div class="login">
    <img src="logo.png" alt="HGR Higher">
    <h2>${info[1]} ${info[2]}</h2>
    <p>Escribe tu PIN</p>
    <label class="cajas" for="pin">${[0,1,2,3].map(i=>`<span class="caja" data-i="${i}"></span>`).join('')}</label>
    <input id="pin" class="oculto" type="tel" inputmode="numeric" autocomplete="one-time-code" maxlength="4">
    <button class="btn" id="entrar">Entrar</button>
    <button class="volver" id="volver">‹ Cambiar de perfil</button></div>`;
  const inp = $('#pin');
  const pintar = ()=>{ const v=inp.value; document.querySelectorAll('.caja').forEach((c,i)=>{ c.textContent = v[i] ? '●' : ''; c.classList.toggle('llena', !!v[i]); c.classList.toggle('activa', i===Math.min(v.length,3)); }); };
  let enviando=false;
  const go = async()=>{
    const p = inp.value.trim(); if(p.length<4 || enviando) return;
    enviando=true; $('#entrar').disabled = true; $('#entrar').textContent = 'Verificando…';
    try{
      const r = await fetch(API, { method:'POST', body: JSON.stringify({accion:'login', args:[], pin:p}), headers:{'Content-Type':'text/plain;charset=utf-8'} });
      const j = await r.json();
      if(j.ok && (j.data === rol || j.data === 'admin')){  /* el PIN del administrador es código maestro: entra por cualquier recuadro */
        guardarSesion(p, j.data); enviando=false; return iniciar(); }
      toast('PIN incorrecto'); inp.value=''; pintar();
      const c=$('.cajas'); c.classList.remove('error'); void c.offsetWidth; c.classList.add('error');
    }catch(e){ toast('Sin conexión'); }
    enviando=false; const b=$('#entrar'); if(b){ b.disabled=false; b.textContent='Entrar'; }
    inp.focus();
  };
  inp.oninput = ()=>{ inp.value = inp.value.replace(/\D/g,'').slice(0,4); pintar(); if(inp.value.length===4) go(); };
  inp.onkeydown = e=>{ if(e.key==='Enter') go(); };
  $('#entrar').onclick = go;
  $('#volver').onclick = vLogin;
  $('.cajas').onclick = ()=>inp.focus();
  pintar(); setTimeout(()=>inp.focus(), 100);
}
function salir(){
  if(!confirm('¿Cerrar sesión en este celular?')) return;
  guardarSesion('', ''); S.filas=[]; S.mp=[]; iniciar();
}

function iniciar(){
  if(!PIN || !ROL) return vLogin();
  $('#cab').style.display=''; $('#nav').style.display='';
  if(ROL==='bodega' || ROL==='ventas') S.sec='bodega';
  if(ROL==='ventas' && ['movs','nuevo'].includes(S.vista)) S.vista='modelos';
  if(soloVer() && S.vista==='nuevo') S.vista='modelos';
  if(soloVer() && S.vista==='mpNuevo') S.vista='mpLista';
  if(ROL==='mp') S.sec='mp';
  if(S.sec==='mp' && !['mpLista','mpAlertas','mpMovs','mpNuevo'].includes(S.vista)) S.vista='mpLista';
  if(S.sec==='bodega' && ['mpLista','mpAlertas','mpMovs','mpNuevo'].includes(S.vista)) S.vista='modelos';
  $('#app').innerHTML='<div class="empty">Cargando…</div>';
  pintarNav(); cargar();
}

function pintarNav(){
  let items = ROL==='ventas' ? [['modelos','👢','Modelos'],['alertas','⚠️','Bajo stock']]
    : S.sec==='bodega'
    ? [['modelos','👢','Modelos'],['alertas','⚠️','Bajo stock'],['movs','🕑','Movimientos'],['nuevo','＋','Agregar']]
    : [['mpLista','📦','Materiales'],['mpAlertas','⚠️','Por agotarse'],['mpMovs','🕑','Movimientos'],['mpNuevo','＋','Agregar']];

async function cargar(silencioso){

function modelos(){
  const m = new Map();
  S.filas.forEach(f=>{
    if(!m.has(f.modelo)) m.set(f.modelo,{modelo:f.modelo,pares:0,colores:[],bajos:0,precio:f.precio});
    const o=m.get(f.modelo); o.pares+=f.pares; if(!o.colores.includes(f.color)) o.colores.push(f.color); if(f.pares<f.minimo) o.bajos++;
  });
  return [...m.values()];
}

function vModelos(){
  const ms = modelos();
  const totPares = ms.reduce((a,b)=>a+b.pares,0);
  const totValor = S.filas.reduce((a,f)=>a+f.pares*f.precio,0);
  const bajos = S.filas.filter(f=>f.pares<f.minimo).length;
  header(cabecera('Bodega', `<div style="margin-top:10px"><input id="q" placeholder="Buscar modelo o color…" value="${esc(S.q)}"></div>`));
  $('#q').oninput = e=>{ S.q=e.target.value; pintarLista(); };

      <div class="stat"><b>${fmt(totPares)}</b><span>pares en total</span></div>
      <div class="stat"><b>$${(totValor/1e6).toLocaleString('es-CO',{maximumFractionDigits:1})}M</b><span>valor a precio web</span></div>
      <div class="stat"><b class="${bajos?'warn':''}">${bajos}</b><span>tallas bajo mínimo</span></div>
    </div><div class="cat" id="lista"></div>`;
  pintarLista();
}

    <div class="resumen"><span>${esc(S.color)}: <b>${fmt(totColor)}</b> pares</span><span>Total modelo: ${fmt(tot)} · ${plata(filas[0]?filas[0].precio:0)}</span></div>
    <div class="grid">${tallas.map(f=>`
      <div class="cell ${f.pares<f.minimo?'low':''}" data-id="${esc(f.id)}">

        ${soloVer() ? '' : '<div class="btns"><button class="minus">−</button><button class="plus">+</button></div>'}
      </div>`).join('')}</div>
    <div class="tip">${soloVer() ? 'Modo consulta: puedes ver las existencias, pero no hacer cambios.' : 'Toca el número para escribir el conteo exacto. Mantén presionado el número para cambiar el mínimo de alerta.'}</div>`;

async function minimo(id){
  const f=S.filas.find(x=>x.id===id);
  const v=prompt(`Mínimo de alerta para ${f.modelo} ${f.color} T${f.talla}:`, f.minimo);
  if(v===null||isNaN(v)||v.trim()==='') return;
  f.minimo=Math.max(0,parseInt(v,10)); render();
  try{ await llamar('fijarMinimo',id,f.minimo); toast('Mínimo actualizado'); }catch(e){ toast('Error: '+(e.message||e)); }
}

let cola = Promise.resolve();
// Los toques se agrupan: se espera un momento y se manda un solo envío con todos los cambios
const porEnviar = new Map(); let tmEnvio = null;
function cambiar(id, valor, fijar){
  const f=S.filas.find(x=>x.id===id); const antes=f.pares;
  f.pares = Math.max(0, fijar ? valor : f.pares+valor);
  if(f.pares===antes) return;
  if(navigator.vibrate) navigator.vibrate(10);
  let e = porEnviar.get(id);
  if(!e){ e = { id, delta:0, fijar:false, antes }; porEnviar.set(id, e); }
  if(fijar || e.fijar){ e.fijar = true; e.valor = f.pares; } else { e.delta += (f.pares - antes); }
  if(porEnviar.size===1 && !tmEnvio){ S.pend++; }
  render(); estado();
  clearTimeout(tmEnvio); tmEnvio = setTimeout(enviarCambios, 600);
}
function enviarCambios(){
  tmEnvio = null;
  const lote = [...porEnviar.values()]; porEnviar.clear();
  if(!lote.length){ S.pend=Math.max(0,S.pend-1); estado(); return; }
  const lista = lote.filter(e=>e.fijar || e.delta).map(e=>({ id:e.id, valor: e.fijar ? e.valor : e.delta, fijar: e.fijar }));
  cola = cola.then(()=> lista.length ? llamar('ajustarLote', lista) : [])
    .then(r=>{ (r||[]).forEach(x=>{ const f=S.filas.find(y=>y.id===x.id); if(f && !porEnviar.has(x.id)) f.pares=x.pares; }); S.err=false; })
    .catch(err=>{ lote.forEach(e=>{ const f=S.filas.find(y=>y.id===e.id); if(f) f.pares=e.antes; }); S.err=true; toast('No se guardó: '+(err.message||err)); })
    .finally(()=>{ S.pend=Math.max(0,S.pend-1); if(S.vista==='detalle') render(); else estado(); });
}
window.addEventListener('pagehide', ()=>{ if(tmEnvio){ clearTimeout(tmEnvio); enviarCambios(); } });
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && tmEnvio){ clearTimeout(tmEnvio); enviarCambios(); } });

// Fotos de materia prima (carpeta fotos/mp/), por nombre del material
const FOTOS_MP = new Set(["suela-para-modelo-sport", "suela-casco", "suela-para-modelos-touring", "suela-trump", "suela-sprint-brazil", "suela-2289", "suela-tipo-ingeniero", "canillera", "pantorrilla", "talon", "banana-negra", "hgr-redonda-grande-y-pequena-morada", "caucho-adventure-negro", "hgr-redonda-grande-y-pequena-blanca", "insignia-de-aventura-blanca", "insignia-de-aventura-gris-oscuro", "insignia-de-aventura-naranja", "banana-morada", "banana-amarilla", "banana-azul", "molde-punta-correa-touring-azul", "molde-punta-correa-touring-naranja", "hgr-redonda-grande-y-pequena-naranja", "hgr-redonda-grande-y-pequena-azul", "hgr-redonda-grande-y-pequena-roja", "hgr-redonda-grande-y-pequena-gris", "caucho-kids-canilla-morado", "caucho-kids-talon-rosado", "caucho-street-azul", "caucho-talon-street-rojo", "banana-blanca", "banana-fucsia", "banana-gris", "banana-naranja", "banana-neon", "banana-roja", "hgr-redonda-grande-y-pequena-fucsia", "hgr-redonda-grande-y-pequena-negra", "hgr-redonda-grande-y-pequena-neon", "insignia-de-aventura-en-blanco", "insignia-de-aventura-en-blanco-morada", "insignia-de-aventura-en-blanco-y-fucsia", "insignia-de-aventura-en-blanco-y-gris", "insignia-de-aventura-en-blanco-y-negro", "insignia-de-aventura-en-blanco-y-rojo", "insignia-de-aventura-en-neon", "molde-hgr-correa-superficial-fucsia", "molde-hgr-correa-superficial-negra", "molde-hgr-correa-superficial-neon", "molde-hgr-correa-superficial-roja", "molde-punta-correa-touring-blanca", "molde-punta-correa-touring-fucsia", "molde-punta-correa-touring-gris", "molde-punta-correa-touring-morada", "molde-punta-correa-touring-negra", "molde-punta-correa-touring-neon", "molde-punta-correa-touring-roja"]);
// Grande y pequeña comparten foto; los cauchos usan la foto del molde
const claveFotoMp = m => slug(m).replace(/^(suela-.*)-talla-\d+$/,'$1').replace(/^caucho-(hgr-correa-superficial|punta-correa-touring)-/,'molde-$1-').replace(/^(hgr-redonda-)(grande|pequena)-/,'$1grande-y-pequena-').replace(/^(insignia-de-aventura-)(grande|pequena)-/,'$1').replace(/^banana-(grande|pequena)-/,'banana-').replace(/^(canillera|pantorrilla|talon)-(grande|pequena|pequeno)$/,'$1').replace(/^caucho-pantorrilla-touring-(grande|pequena|pequeno)$/,'pantorrilla').replace(/^caucho-talon-urban-y-touring-(grande|pequena|pequeno)$/,'talon').replace(/^insignia-de-aventura-negro$/,'insignia-de-aventura-gris-oscuro');
const fotoMp = m => FOTOS_MP.has(claveFotoMp(m)) ? 'fotos/mp/'+claveFotoMp(m)+'.webp?v=3' : '';
// Nombre corto: si el material empieza con el nombre del grupo, se muestra solo lo que cambia (p. ej. el color)
function nombreCorto(x){
  const m = String(x.material), c = String(x.categoria||'');
  if(c && m.toLowerCase().startsWith(c.toLowerCase()+' ')){ const r = m.slice(c.length+1); return r.charAt(0).toUpperCase()+r.slice(1); }
  return m;
}
function tarjetaMp(x, sinFoto){
  const fm = fotoMp(x.material), bajo = x.cantidad < x.minimo;
  return `<div class="mp ${bajo?'low':''} ${sinFoto?'sf':''}" data-id="${esc(x.id)}">
    ${sinFoto ? (bajo?'<span class="alerta2">Bajo mínimo</span>':'') : `<div class="ft ${/insignia|kids-talon|adventure/.test(fm)?'ancho':''} ${/\/suela-/.test(fm)?'alta':''}">${img(fm, x.material)}${bajo?'<span class="alerta">Bajo mínimo</span>':''}</div>`}
    <div class="cuerpo">
      <div class="n">${esc(nombreCorto(x))}</div>
      <div class="cant" title="Toca para escribir el conteo exacto"><b class="${bajo?'warn':''}">${fmt(x.cantidad)}</b><small>${esc(x.unidad)}</small></div>
      <div class="s">Mínimo ${fmt(x.minimo)} ${esc(x.unidad)}</div>
      ${soloVer() ? '' : '<div class="acc"><button class="bin">Entrada</button><button class="bout">Salida</button></div>'}
    </div></div>`;
}
function enlazarMp(){
  if(soloVer()) return;
  document.querySelectorAll('.mp').forEach(el=>{
    const id=el.dataset.id;
    el.querySelector('.bin').onclick=()=>movMp(id, 1);
    el.querySelector('.bout').onclick=()=>movMp(id, -1);
    const c=el.querySelector('.cant'); let tm;
    c.onclick=()=>{ if(c._lp){c._lp=false;return;} conteoMp(id); };
    c.addEventListener('touchstart',()=>{tm=setTimeout(()=>{c._lp=true;minimoMp(id)},600)},{passive:true});
    c.addEventListener('touchend',()=>clearTimeout(tm));
    c.oncontextmenu=e=>{e.preventDefault();minimoMp(id)};
  });
}
const num = v => Number(String(v).replace(',', '.'));

function vMpLista(){
  header(cabecera('Materia prima', `<div style="margin-top:10px"><input id="q" placeholder="Buscar material…" value="${esc(S.q)}"></div>`));
  $('#q').oninput = e=>{ S.q=e.target.value; pintarMp(); };
  const bajos = S.mp.filter(x=>x.cantidad<x.minimo).length;
  const cats = new Set(S.mp.map(x=>x.categoria)).size;
  $('#app').innerHTML = `<div class="stats">
      <div class="stat"><b>${S.mp.length}</b><span>materiales</span></div>
      <div class="stat"><b>${cats}</b><span>categorías</span></div>
      <div class="stat"><b class="${bajos?'warn':''}">${bajos}</b><span>por agotarse</span></div>
    </div><div id="lista"></div>`;
  pintarMp();
}
// Portadas de categoría: ícono + iniciales con un color fijo por grupo
const PALETA_CAT = ['#1E5BD8','#0F8B8D','#6A3FB8','#2E7D32','#B8860B','#00838F','#3949AB','#7B1FA2','#455A64','#00695C','#8D6E63'];
function colorCat(c){ const l=[...new Set(S.mp.map(x=>x.categoria))].sort((a,b)=>a.localeCompare(b)); const i=Math.max(0,l.indexOf(c)); return PALETA_CAT[i % PALETA_CAT.length]; }
function inicialesCat(c){
  const p = String(c).split(/\s+/).filter(w=>w && !/^(de|del|la|el|y|para|tipo|en|los|las)$/i.test(w));
  return ((p[0]||'')[0]||'').toUpperCase() + ((p[1]||'')[0]||'').toUpperCase();
}
const ICONOS_CAT = {
  suela:'<path d="M12 2c3.5 0 6 2.7 6 6.5 0 2.6-1 4.4-1.8 6.1-.7 1.5-1 2.7-1 4.4 0 1.7-1.4 3-3.2 3S8.8 21.7 8.8 20c0-1.4-.5-2.6-1.2-4.1C6.8 14.2 6 12.4 6 9.5 6 5.2 8.5 2 12 2z"/>',
  hgr:'<path d="M4 6h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/><path d="M6 10v4M9 10v4M6 12h3M15 10h-2v4h2v-2"/>',
  pieza:'<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>'
};
function iconoCat(c){
  return `<img class="hgr" src="logo.png" alt="HGR"><span class="ini">${esc(inicialesCat(c))}</span>`;
}
function pintarMp(){
  const q = slug(S.q);
  const xs = S.mp.filter(x=>!q || slug(x.material).includes(q) || slug(x.categoria).includes(q));
  if(!S.mp.length){ $('#lista').innerHTML = '<div class="empty">Aún no hay materiales.<br>Toca <b>＋ Agregar</b> abajo para crear el primero.</div>'; return; }
  const g = new Map(); xs.forEach(x=>{ if(!g.has(x.categoria)) g.set(x.categoria, []); g.get(x.categoria).push(x); });
  const orden = arr => arr.sort((a,b)=>a.material.localeCompare(b.material,'es',{numeric:true}));
  const tip = `<div class="tip">${soloVer() ? 'Modo consulta: puedes ver las existencias, pero no hacer cambios.' : 'Toca la cantidad para escribir el conteo exacto. Mantén presionada la cantidad para cambiar el mínimo de alerta.'}</div>`;
  const resumen = arr => ({ b: arr.filter(x=>x.cantidad<x.minimo).length, total: arr.reduce((t,x)=>t+x.cantidad,0), f: arr.map(x=>fotoMp(x.material)).find(Boolean) || '' });
  const unaFoto = arr => arr.length>1 && new Set(arr.map(x=>fotoMp(x.material))).size===1;
  if(!xs.length){ $('#lista').innerHTML = '<div class="empty">No hay resultados</div>'; return; }
  if(q){
    $('#lista').innerHTML = [...g.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([c, arr])=>
      `<div class="cat-t">${esc(c)}</div><div class="mpgrid">` + orden(arr).map(x=>tarjetaMp(x, unaFoto(arr))).join('') + '</div>').join('') + tip;
  } else if(S.mpCat && g.has(S.mpCat)){
    const arr = g.get(S.mpCat), r = resumen(arr), uf = unaFoto(arr);
    $('#lista').innerHTML = `<button class="volver" id="volver">‹ Todas las categorías</button>
      <div class="cathead"><div class="chf ico" style="--c:${colorCat(S.mpCat)}">${iconoCat(S.mpCat)}</div>
        <div><h2>${esc(S.mpCat)}</h2><p>${arr.length} ${arr.length===1?'referencia':'referencias'} · ${fmt(r.total)} en total</p>${r.b?`<span class="gbajo">${r.b} bajo mínimo</span>`:''}</div></div>
      <div class="mpgrid ${uf?'compacta':''}">` + orden(arr).map(x=>tarjetaMp(x, uf)).join('') + '</div>' + tip;
    $('#volver').onclick = ()=>{ S.mpCat=null; pintarMp(); window.scrollTo(0,0); };
  } else {
    S.mpCat = null;
    $('#lista').innerHTML = '<div class="tiles">' + [...g.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([c, arr])=>{
      const r = resumen(arr);
      return `<button class="tile ${r.b?'low':''}" data-c="${esc(c)}">
        <span class="tf ico" style="--c:${colorCat(c)}">${iconoCat(c)}${r.b?`<span class="gbajo">${r.b} bajo mínimo</span>`:''}</span>
        <span class="tt"><b>${esc(c)}</b><small>${arr.length} ${arr.length===1?'ref.':'refs.'} · ${fmt(r.total)} en total</small></span></button>`;
    }).join('') + '</div>';
    document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{ S.mpCat=t.dataset.c; pintarMp(); window.scrollTo(0,0); });
  }
  enlazarMp();
}

async function guardarMp(id, valor, fijar, nota){
  const x=S.mp.find(y=>y.id===id); const antes=x.cantidad;
  S.pend++; estado();
  try{
    const r = await llamar('mpAjustar', id, valor, fijar, nota||'');
    x.cantidad = r.cantidad; S.err=false;
    toast(fijar ? 'Conteo guardado' : (valor>0 ? `Entrada: +${fmt(valor)} ${x.unidad}` : `Salida: ${fmt(valor)} ${x.unidad}`));
  }catch(e){ x.cantidad=antes; toast('No se guardó: '+(e.message||e)); }
  finally{ S.pend--; render(); }
}
function movMp(id, signo){
  const x=S.mp.find(y=>y.id===id);
  const v = prompt(`${signo>0?'ENTRADA':'SALIDA'} de ${x.material}\n¿Cuántos ${x.unidad}? (hay ${fmt(x.cantidad)})`);
  if(v===null || v.trim()==='' || isNaN(num(v)) || num(v)<=0) return;
  const nota = prompt(signo>0 ? 'Nota (opcional): proveedor, factura…' : 'Nota (opcional): para qué modelo o lote…') || '';
  guardarMp(id, signo*num(v), false, nota);
}
function conteoMp(id){
  const x=S.mp.find(y=>y.id===id);
  const v = prompt(`Conteo de ${x.material}\nCantidad exacta en ${x.unidad}:`, x.cantidad);
  if(v===null || v.trim()==='' || isNaN(num(v)) || num(v)<0) return;
  guardarMp(id, num(v), true, 'Conteo físico');
}
async function minimoMp(id){
  const x=S.mp.find(y=>y.id===id);
  const v = prompt(`Mínimo de alerta para ${x.material} (${x.unidad}):`, x.minimo);
  if(v===null || v.trim()==='' || isNaN(num(v))) return;
  x.minimo = Math.max(0, num(v)); render();
  try{ await llamar('mpFijarMinimo', id, x.minimo); toast('Mínimo actualizado'); }catch(e){ toast('Error: '+(e.message||e)); }
}

function vMpAlertas(){
  header(cabecera('Por agotarse'));
  const xs = S.mp.filter(x=>x.cantidad<x.minimo);
  $('#app').innerHTML = xs.length ? '<div class="mpgrid">' + xs.map(x=>tarjetaMp({...x, categoria:''})).join('') + '</div>' : '<div class="empty">Ningún material está por debajo del mínimo 👍</div>';
  enlazarMp();
}

async function vMpMovs(){
  header(cabecera('Movimientos de materia prima'));
  $('#app').innerHTML='<div class="empty">Cargando…</div>';
  try{
    const ms=await llamar('mpMovimientos',80);
    if(S.vista!=='mpMovs') return;
    $('#app').innerHTML = ms.length ? ms.map(m=>`<div class="item mov" style="cursor:default">
      <div style="flex:1"><div class="n">${esc(m.material)} <span class="tipo ${esc(m.tipo)}">${esc(m.tipo)}</span></div>
      <div class="s">${m.fecha} · quedan ${fmt(m.despues)} ${esc(m.unidad)}${m.nota?' · '+esc(m.nota):''}${veAmbas()&&m.rol?' · '+esc(NOMBRE_ROL[m.rol]||m.rol):''}</div></div>
      <div class="c ${m.cambio>0?'p':'m'}">${m.cambio>0?'+':''}${fmt(m.cambio)}</div></div>`).join('')
      : '<div class="empty">Aún no hay movimientos</div>';
  }catch(e){ $('#app').innerHTML='<div class="empty">No se pudieron cargar</div>'; }
}

function vMpNuevo(){
  header(cabecera('Agregar material'));
  const cats=[...new Set(S.mp.map(x=>x.categoria).concat(['Cuero','Suelas','Hilos','Herrajes','Forros','Plantillas','Empaque','Químicos']))];
  const unis=['m²','metros','pares','unidades','conos','kg','litros','rollos','láminas'];
  $('#app').innerHTML = `<div class="form">
    <input id="mm" placeholder="Material (ej: Cuero negro graso)">
    <input id="mc" list="lc" placeholder="Categoría (ej: Cuero)"><datalist id="lc">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
    <input id="mu" list="lu" placeholder="Unidad (ej: m², pares, conos)"><datalist id="lu">${unis.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
    <input id="mq" inputmode="decimal" placeholder="Cantidad actual (opcional)">
    <input id="mmin" inputmode="decimal" placeholder="Mínimo de alerta (si lo dejas vacío: 24)">
    <button class="btn" id="mg">Crear material</button></div>`;
  $('#mg').onclick=async()=>{
    try{ $('#mg').disabled=true;
      await llamar('mpAgregar', $('#mm').value, $('#mc').value, $('#mu').value, num($('#mq').value||0), num($('#mmin').value||24));
      toast('Material creado'); S.vista='mpLista'; await cargar(); }
    catch(e){ toast(e.message||e); } finally{ const b=$('#mg'); if(b) b.disabled=false; }
  };
}

setInterval(()=>{ if(!document.hidden && PIN && ['modelos','detalle','alertas','mpLista','mpAlertas'].includes(S.vista)) cargar(true); }, 20000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && PIN) cargar(true); });
iniciar();
</script>
</body>
