<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Inventario Higher</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inventario">
<meta name="theme-color" content="#0E0E0F">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  :root{
    --bg:#0E0E0F; --card:#18181A; --card2:#222225; --line:#2C2C30;
    --txt:#F4F4F5; --sub:#9A9AA2; --acc:#F5B300; --ok:#22C55E; --bad:#EF4444;
    --foto:#EDEDEF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5;background:rgba(14,14,15,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .hin{max-width:960px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 10px}
  .top{display:flex;align-items:center;gap:10px}
  .logo{height:30px;width:auto;display:block;margin-bottom:4px}
  h1{font-size:20px;margin:2px 0 0;font-weight:700}
  .sync{margin-left:auto;font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  .dot.busy{background:var(--acc)} .dot.err{background:var(--bad)}
  .back{background:none;border:0;color:var(--acc);font-size:15px;padding:0;margin-bottom:6px;cursor:pointer}
  input{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:11px 12px;font-size:16px;outline:none}
  input:focus{border-color:var(--acc)}
  main{padding:12px 16px 100px;max-width:960px;margin:0 auto}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
  .stat b{display:block;font-size:20px} .stat span{font-size:12px;color:var(--sub)}

  /* catálogo de modelos */
  .cat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
  @media(min-width:640px){.cat{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:900px){.cat{grid-template-columns:repeat(4,1fr)}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .12s}
  .card:active{transform:scale(.98)}
  .ph{aspect-ratio:1/1;background:var(--foto);display:flex;align-items:center;justify-content:center;position:relative}
  .ph img{width:86%;height:86%;object-fit:contain;mix-blend-mode:multiply}
  .ph .nf{color:#888;font-size:12px}
  .badge{position:absolute;top:8px;right:8px;background:rgba(14,14,15,.85);color:#fff;font-weight:700;font-size:13px;border-radius:999px;padding:3px 9px}
  .badge.low{background:var(--bad)}
  .info{padding:10px 12px 12px}
  .info .n{font-weight:600;font-size:14px;line-height:1.25}
  .dots{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
  .cd{width:13px;height:13px;border-radius:50%;border:1px solid rgba(255,255,255,.25)}
  .info .s{font-size:11.5px;color:var(--sub);margin-top:6px}

  /* detalle */
  .hero{background:var(--foto);border-radius:18px;aspect-ratio:4/3;max-height:300px;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .hero img{height:88%;width:88%;object-fit:contain;mix-blend-mode:multiply}
  .colores{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
  .colores::-webkit-scrollbar{display:none}
  .col{flex:none;width:76px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:5px;cursor:pointer;text-align:center;color:var(--txt)}
  .col.on{border-color:var(--acc)}
  .col .mini{background:var(--foto);border-radius:9px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
  .col .mini img{width:88%;height:88%;object-fit:contain;mix-blend-mode:multiply}
  .col .cn{font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .col .cq{font-size:11px;color:var(--sub)}
  .resumen{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;color:var(--sub);font-size:13px}
  .resumen b{color:var(--txt);font-size:16px}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  @media(min-width:520px){.grid{grid-template-columns:repeat(4,1fr)}}
  @media(min-width:800px){.grid{grid-template-columns:repeat(6,1fr)}}
  .cell{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:center}
  .cell.low{border-color:rgba(239,68,68,.55);background:rgba(239,68,68,.07)}
  .cell .t{font-size:12px;color:var(--sub)}
  .cell .q{font-size:26px;font-weight:700;margin:2px 0 6px;cursor:pointer}
  .btns{display:flex;gap:6px}
  .btns button{flex:1;height:38px;border-radius:10px;border:0;font-size:20px;font-weight:700;cursor:pointer;background:var(--card2);color:var(--txt)}
  .btns button.plus{background:var(--acc);color:#111}
  .btns button:active{transform:scale(.95)}
  .tip{color:var(--sub);font-size:12.5px;margin-top:14px}

  /* listas */
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:8px}
  .th{width:52px;height:52px;flex:none;border-radius:10px;background:var(--foto);display:flex;align-items:center;justify-content:center}
  .th img{width:88%;height:88%;object-fit:contain;mix-blend-mode:multiply}
  .item .n{font-weight:600} .item .s{font-size:12.5px;color:var(--sub);margin-top:2px}
  .pill{margin-left:auto;text-align:right;min-width:48px}
  .pill b{font-size:18px;display:block} .pill small{color:var(--sub);font-size:11px}
  .warn{color:var(--bad)}
  .mov .c{font-weight:700;min-width:40px;text-align:center}
  .mov .c.p{color:var(--ok)} .mov .c.m{color:var(--bad)}
  .form{display:grid;gap:10px;margin-top:10px}
  .btn{background:var(--acc);color:#111;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:700;cursor:pointer}

  nav{position:fixed;bottom:0;left:0;right:0;background:rgba(18,18,20,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  nav button{flex:1;background:none;border:0;color:var(--sub);font-size:11px;padding:6px 0;cursor:pointer}
  nav button i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}
  nav button.on{color:var(--acc)}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90%}
  .toast.show{opacity:1}
  .empty{color:var(--sub);text-align:center;padding:40px 0}
</style>
</head>
<body>
<header><div class="hin" id="hdr"></div></header>
<main id="app"><div class="empty">Cargando inventario…</div></main>
<nav>
  <button data-v="modelos" class="on"><i>👢</i>Modelos</button>
  <button data-v="alertas"><i>⚠️</i>Bajo stock</button>
  <button data-v="movs"><i>🕑</i>Movimientos</button>
  <button data-v="nuevo"><i>＋</i>Agregar</button>
</nav>
<div class="toast" id="toast"></div>

<script>
/* ---------- conexión con la hoja de Google (Apps Script) ---------- */
const API = 'https://script.google.com/macros/s/AKfycbzmtdVVl3ptvrOrlAo2PoKHOk1atA1fhul5sgtPWr2By91VU4bqt2r1ZEyuXi4OV3MQNw/exec';
async function llamar(accion, ...args){
  const r = await fetch(API, { method:'POST', body: JSON.stringify({accion, args}), headers:{'Content-Type':'text/plain;charset=utf-8'} });
  if(!r.ok) throw new Error('Sin conexión ('+r.status+')');
  const j = await r.json();
  if(!j.ok) throw new Error(j.error);
  return j.data;
}

/* ---------- fotos (carpeta fotos/) ---------- */
const slug = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
// Foto general de cada modelo
const FOTO_MODELO = {
  'bota-fusion':'png','bota-race-white':'png','bota-militar':'png','botin-force':'png','botin-urban-soft':'png',
  'botin-force-industrial':'png','botin-sport':'png','bota-race':'png','botin-street':'png','bota-ingeniero-nobuck':'webp',
  'bota-ingeniero-lona':'png','bota-ingeniero':'webp','bota-basica-industrial':'webp','bota-militar-motorizada':'webp',
  'bota-motorizada-media-cana':'webp','bota-motorizada-cana-alta-elite':'webp','botin-urban':'webp','botin-urban-flex':'webp',
  'botin-urban-go':'webp','bota-touring-race':'png'
};
// Foto por color (modelo--color)
const FOTO_COLOR = {};
[
 'bota-race-white--azul-celeste.png','bota-race-white--gris.png','bota-race-white--morado.png','bota-race-white--naranja.png','bota-race-white--neon.png',
 'botin-urban-soft--rojo.png','botin-urban-soft--azul.png','botin-urban-soft--gris.png','botin-urban-soft--fucsia.png','botin-urban-soft--neon.png',
 'botin-sport--azul-oscuro.png','botin-sport--fucsia.png','botin-sport--gris.png','botin-sport--neon.png','botin-sport--rojo.png',
 'bota-race--rojo.png','bota-race--azul-oscuro.png','bota-race--fucsia.png','bota-race--gris.png','bota-race--neon.png',
 'botin-street--rojo.png','botin-street--azul-oscuro.png','botin-street--fucsia.png','botin-street--gris.png','botin-street--neon.png',
 'bota-ingeniero-lona--cafe.png','bota-ingeniero-lona--negro.png','bota-ingeniero--cafe.png','bota-ingeniero--negro.webp',
 'bota-basica-industrial--cafe.jpeg','bota-basica-industrial--negro.webp',
 'botin-urban--rojo.png','botin-urban--azul.png','botin-urban--fucsia.png','botin-urban--gris.png','botin-urban--neon.png',
 'bota-touring-race--rojo.png','bota-touring-race--azul.png','bota-touring-race--fucsia.png','bota-touring-race--gris.png','bota-touring-race--neon.png'
].forEach(f=>{ FOTO_COLOR[f.replace(/\.[a-z]+$/,'')] = 'fotos/'+f; });
function foto(modelo, color){
  const m = slug(modelo);
  if(color && FOTO_COLOR[m+'--'+slug(color)]) return FOTO_COLOR[m+'--'+slug(color)];
  return FOTO_MODELO[m] ? 'fotos/'+m+'.'+FOTO_MODELO[m] : '';
}
const img = (src, alt='') => src ? `<img loading="lazy" src="${src}" alt="${esc(alt)}">` : '<span class="nf">Sin foto</span>';
// Color para los puntos
const TONO = {negro:'#111',cafe:'#6B4423',gris:'#8E8E93',azul:'#1E5BD8','azul-oscuro':'#1B2A6B','azul-celeste':'#6EC6F0',
  fucsia:'#E0218A',neon:'#C6F21C',rojo:'#D7261E',morado:'#7B3FB8',naranja:'#F07A1A',blanco:'#fff',verde:'#2E8B57'};
const tono = c => TONO[slug(c)] || '#555';

let S = { filas:[], vista:'modelos', modelo:null, color:null, q:'', pend:0 };
const $ = s => document.querySelector(s);
const fmt = n => n.toLocaleString('es-CO');
const plata = n => '$' + Math.round(n).toLocaleString('es-CO');
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),1800); }
function estado(){ const d=$('.dot'), l=$('#syncTxt'); if(!d) return;
  d.className='dot'+(S.err?' err':S.pend?' busy':''); l.textContent=S.err?'Sin conexión':S.pend?'Guardando…':'Sincronizado'; }

async function cargar(silencioso){
  try{
    if(S.pend) return;
    const r = await llamar('obtenerInventario');
    if(S.pend) return;
    S.filas = r.filas; S.err=false; render();
  }catch(e){ S.err=true; estado(); if(!silencioso) toast('Error al cargar: '+(e.message||e)); }
}

function modelos(){
  const m = new Map();
  S.filas.forEach(f=>{
    if(!m.has(f.modelo)) m.set(f.modelo,{modelo:f.modelo,pares:0,colores:[],bajos:0,precio:f.precio});
    const o=m.get(f.modelo); o.pares+=f.pares; if(!o.colores.includes(f.color)) o.colores.push(f.color); if(f.pares<f.minimo) o.bajos++;
  });
  return [...m.values()];
}

function header(html){ $('#hdr').innerHTML = html; estado(); }
function cabecera(titulo, extra=''){
  return `<div class="top"><div><img class="logo" src="logo.png" alt="HGR Higher"><h1>${titulo}</h1></div>
  <div class="sync"><span class="dot"></span><span id="syncTxt"></span></div></div>${extra}`;
}

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.v===S.vista || (S.vista==='detalle'&&b.dataset.v==='modelos')));
  ({modelos:vModelos, detalle:vDetalle, alertas:vAlertas, movs:vMovs, nuevo:vNuevo})[S.vista]();
}

/* ---------- catálogo ---------- */
function vModelos(){
  const ms = modelos();
  const totPares = ms.reduce((a,b)=>a+b.pares,0);
  const totValor = S.filas.reduce((a,f)=>a+f.pares*f.precio,0);
  const bajos = S.filas.filter(f=>f.pares<f.minimo).length;
  header(cabecera('Inventario', `<div style="margin-top:10px"><input id="q" placeholder="Buscar modelo o color…" value="${esc(S.q)}"></div>`));
  $('#q').oninput = e=>{ S.q=e.target.value; pintarLista(); };
  $('#app').innerHTML = `<div class="stats">
      <div class="stat"><b>${fmt(totPares)}</b><span>pares en total</span></div>
      <div class="stat"><b>$${(totValor/1e6).toLocaleString('es-CO',{maximumFractionDigits:1})}M</b><span>valor a precio web</span></div>
      <div class="stat"><b class="${bajos?'warn':''}">${bajos}</b><span>tallas bajo mínimo</span></div>
    </div><div class="cat" id="lista"></div>`;
  pintarLista();
}
function pintarLista(){
  const q = slug(S.q);
  const ms = modelos().filter(m=>!q || slug(m.modelo).includes(q) || m.colores.some(c=>slug(c).includes(q)));
  $('#lista').innerHTML = ms.length ? ms.map(m=>`
    <div class="card" data-m="${esc(m.modelo)}">
      <div class="ph">${img(foto(m.modelo), m.modelo)}<span class="badge ${m.pares===0?'low':''}">${fmt(m.pares)}</span></div>
      <div class="info">
        <div class="n">${esc(m.modelo)}</div>
        <div class="dots">${m.colores.map(c=>`<span class="cd" title="${esc(c)}" style="background:${tono(c)}"></span>`).join('')}</div>
        <div class="s">${m.colores.length} ${m.colores.length===1?'color':'colores'} · ${plata(m.precio)}</div>
      </div>
    </div>`).join('') : '<div class="empty" style="grid-column:1/-1">No hay resultados</div>';
  document.querySelectorAll('.card').forEach(el=>el.onclick=()=>{ S.modelo=el.dataset.m; S.color=null; S.vista='detalle'; render(); scrollTo(0,0); });
}

/* ---------- detalle de un modelo ---------- */
function vDetalle(){
  const filas = S.filas.filter(f=>f.modelo===S.modelo);
  const colores = [...new Set(filas.map(f=>f.color))];
  if(!S.color || !colores.includes(S.color)) S.color = colores[0];
  const tot = filas.reduce((a,f)=>a+f.pares,0);
  header(`<button class="back" id="atras">‹ Modelos</button>` + cabecera(esc(S.modelo)));
  $('#atras').onclick=()=>{ S.vista='modelos'; render(); };
  const tallas = filas.filter(f=>f.color===S.color).sort((a,b)=>a.talla-b.talla);
  const totColor = tallas.reduce((a,f)=>a+f.pares,0);
  $('#app').innerHTML = `
    <div class="hero">${img(foto(S.modelo, S.color), S.modelo+' '+S.color)}</div>
    ${colores.length>1 ? `<div class="colores">${colores.map(c=>{
      const n=filas.filter(f=>f.color===c).reduce((a,f)=>a+f.pares,0);
      return `<button class="col ${c===S.color?'on':''}" data-c="${esc(c)}">
        <div class="mini">${img(foto(S.modelo,c), c)}</div>
        <div class="cn">${esc(c)}</div><div class="cq">${n} pares</div></button>`}).join('')}</div>` : ''}
    <div class="resumen"><span>${esc(S.color)}: <b>${fmt(totColor)}</b> pares</span><span>Total modelo: ${fmt(tot)} · ${plata(filas[0]?filas[0].precio:0)}</span></div>
    <div class="grid">${tallas.map(f=>`
      <div class="cell ${f.pares<f.minimo?'low':''}" data-id="${esc(f.id)}">
        <div class="t">Talla ${f.talla}</div>
        <div class="q">${f.pares}</div>
        <div class="btns"><button class="minus">−</button><button class="plus">+</button></div>
      </div>`).join('')}</div>
    <div class="tip">Toca el número para escribir el conteo exacto. Mantén presionado el número para cambiar el mínimo de alerta.</div>`;
  document.querySelectorAll('.col').forEach(b=>b.onclick=()=>{ S.color=b.dataset.c; vDetalle(); });
  document.querySelectorAll('.cell').forEach(c=>{
    const id=c.dataset.id;
    c.querySelector('.plus').onclick=()=>cambiar(id,1,false);
    c.querySelector('.minus').onclick=()=>cambiar(id,-1,false);
    const q=c.querySelector('.q'); let tm;
    q.onclick=()=>{ if(q._lp){q._lp=false;return;} const f=S.filas.find(x=>x.id===id);
      const v=prompt(`${f.modelo} ${f.color} T${f.talla}\nCantidad exacta de pares:`, f.pares);
      if(v!==null && v.trim()!=='' && !isNaN(v)) cambiar(id, parseInt(v,10), true); };
    q.addEventListener('touchstart',()=>{tm=setTimeout(()=>{q._lp=true;minimo(id)},600)},{passive:true});
    q.addEventListener('touchend',()=>clearTimeout(tm));
    q.oncontextmenu=e=>{e.preventDefault();minimo(id)};
  });
}

async function minimo(id){
  const f=S.filas.find(x=>x.id===id);
  const v=prompt(`Mínimo de alerta para ${f.modelo} ${f.color} T${f.talla}:`, f.minimo);
  if(v===null||isNaN(v)||v.trim()==='') return;
  f.minimo=Math.max(0,parseInt(v,10)); render();
  try{ await llamar('fijarMinimo',id,f.minimo); toast('Mínimo actualizado'); }catch(e){ toast('Error: '+(e.message||e)); }
}

let cola = Promise.resolve();
function cambiar(id, valor, fijar){
  const f=S.filas.find(x=>x.id===id); const antes=f.pares;
  f.pares = Math.max(0, fijar ? valor : f.pares+valor);
  if(f.pares===antes) return;
  if(navigator.vibrate) navigator.vibrate(10);
  render(); S.pend++; estado();
  cola = cola.then(()=>llamar('ajustar', id, valor, fijar, ''))
    .then(r=>{ f.pares=r.pares; S.err=false; })
    .catch(e=>{ f.pares=antes; S.err=true; toast('No se guardó: '+(e.message||e)); })
    .finally(()=>{ S.pend--; if(S.vista==='detalle') render(); else estado(); });
}

/* ---------- bajo stock ---------- */
function vAlertas(){
  header(cabecera('Bajo stock'));
  const b=S.filas.filter(f=>f.pares<f.minimo);
  const g=new Map(); b.forEach(f=>{const k=f.modelo+'||'+f.color; if(!g.has(k)) g.set(k,[]); g.get(k).push(f);});
  $('#app').innerHTML = b.length ? [...g.values()].map(fs=>`
    <div class="item" data-m="${esc(fs[0].modelo)}" data-c="${esc(fs[0].color)}">
      <div class="th">${img(foto(fs[0].modelo, fs[0].color))}</div>
      <div><div class="n">${esc(fs[0].modelo)}</div><div class="s">${esc(fs[0].color)} · Tallas: ${fs.map(f=>f.talla).join(', ')}</div></div>
      <div class="pill"><b class="warn">${fs.length}</b><small>tallas</small></div></div>`).join('')
    : '<div class="empty">Todo está por encima del mínimo 👍</div>';
  document.querySelectorAll('.item').forEach(el=>el.onclick=()=>{ S.modelo=el.dataset.m; S.color=el.dataset.c; S.vista='detalle'; render(); scrollTo(0,0); });
}

/* ---------- movimientos ---------- */
async function vMovs(){
  header(cabecera('Movimientos'));
  $('#app').innerHTML='<div class="empty">Cargando…</div>';
  try{
    const ms=await llamar('obtenerMovimientos',60);
    if(S.vista!=='movs') return;
    $('#app').innerHTML = ms.length ? ms.map(m=>`<div class="item mov">
      <div class="th">${img(foto(m.modelo, m.color))}</div>
      <div style="flex:1"><div class="n">${esc(m.modelo)}</div>
      <div class="s">${esc(m.color)} · T${m.talla} · ${m.fecha} · quedan ${m.despues}${m.nota?' · '+esc(m.nota):''}</div></div>
      <div class="c ${m.cambio>0?'p':'m'}">${m.cambio>0?'+':''}${m.cambio}</div></div>`).join('')
      : '<div class="empty">Aún no hay movimientos</div>';
  }catch(e){ $('#app').innerHTML='<div class="empty">No se pudieron cargar</div>'; }
}

/* ---------- agregar ---------- */
function vNuevo(){
  header(cabecera('Agregar modelo o color'));
  const ms=modelos().map(m=>m.modelo);
  $('#app').innerHTML = `<div class="form">
    <label style="color:var(--sub);font-size:13px">Modelo (escribe uno nuevo o uno existente para sumarle un color)</label>
    <input id="nm" list="lm" placeholder="Ej: Botín Urban"><datalist id="lm">${ms.map(m=>`<option value="${esc(m)}">`).join('')}</datalist>
    <input id="nc" placeholder="Color (ej: Verde)">
    <input id="np" type="number" inputmode="numeric" placeholder="Precio en COP (opcional)">
    <button class="btn" id="ng">Crear con tallas 34 a 45</button></div>`;
  $('#ng').onclick=async()=>{
    const m=$('#nm').value, c=$('#nc').value, p=$('#np').value;
    try{ $('#ng').disabled=true; const n=await llamar('agregarModelo',m,c,p); toast(`Listo: ${n} tallas creadas`);
      await cargar(); S.modelo=m.trim(); S.color=c.trim(); S.vista='detalle'; render(); }
    catch(e){ toast(e.message||e); } finally{ const b=$('#ng'); if(b) b.disabled=false; }
  };
}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{ S.vista=b.dataset.v; render(); scrollTo(0,0); });
setInterval(()=>{ if(!document.hidden && (S.vista==='modelos'||S.vista==='detalle'||S.vista==='alertas')) cargar(true); }, 20000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) cargar(true); });
cargar();
</script>
</body>
</html>
